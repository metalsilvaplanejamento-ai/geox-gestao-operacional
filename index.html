<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#651d34"><title>GEOX | Gestão Operacional</title><link rel="stylesheet" href="assets/style.css?v=5"></head><body>
<header><div class="brand"><img src="assets/logo.png" alt="GEOX"><div><b>GESTÃO OPERACIONAL</b><small>Controle de obras, equipamentos e logística</small></div></div><div class="headright"><span id="identity"></span><button id="signout" class="light hidden">Sair</button></div></header>
<section id="auth" class="auth card"><h1>Bem-vindo ao GEOX</h1><p>Entre com uma conta autorizada para acessar os dados da empresa.</p><form id="login" class="fields"><label>E-mail<input type="email" name="email" autocomplete="email" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button>Entrar</button></form><button id="toggleSignup" class="link">Solicitar cadastro</button><form id="signup" class="fields hidden"><label>Nome completo<input name="full_name" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha (mínimo 6 caracteres)<input type="password" name="password" minlength="6" required></label><button>Solicitar acesso</button></form><p id="authNotice" role="status"></p></section>
<main id="workspace" class="hidden"><div class="workspace-layout"><aside class="sidebar"><div class="sidebar-title">MENU PRINCIPAL</div><nav id="nav" aria-label="Módulos"></nav><div class="sidebar-foot">GEOX · Gestão Operacional</div></aside><div class="workspace-content"><div class="topline"><div><h1>Central de operações</h1><p id="statusText">Dados conectados ao Supabase</p></div><button id="reload" class="outline">Atualizar</button></div><div id="metrics" class="metrics"></div><section class="card"><div class="topline"><h2 id="heading"></h2><div class="actions"><input id="search" placeholder="Pesquisar registros..." aria-label="Pesquisar"><button id="add">+ Novo</button></div></div><div id="body"></div></section></div></div></main>
<dialog id="modal"><form id="editor"><div class="topline"><h2 id="modalTitle">Registro</h2><button type="button" id="close" class="outline">Fechar</button></div><div id="formFields" class="formgrid"></div><div class="formactions"><button type="submit">Salvar</button></div></form></dialog><div id="toast" role="status"></div>
<script type="module" src="assets/app.js?v=5"></script></body></html>
